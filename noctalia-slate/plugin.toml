# Slate — Noctalia v5 plugin for BasitAli/slate.
#
# service: refreshes block list (slate ls --json)
# widget: bar pill “My Slate”
# panel: block cards
# launcher: /slate — todos, links (paste manually), open blocks

id = "basitali/noctalia-slate"
name = "Slate"
version = "0.2.5"
plugin_api = 9
author = "basitali"
license = "MIT"
icon = "clipboard-list"
description = "Block cards for open work; clipboard offer for Jira/PR/Slack; /slate launcher."
dependencies = []
tags = ["slate", "jira", "bar", "panel", "clipboard", "launcher"]

[[setting]]
key = "blocks_refresh_ms"
type = "int"
label_key = "settings.blocks_refresh_ms.label"
description_key = "settings.blocks_refresh_ms.description"
default = 5000
min = 1000
max = 60000
advanced = true

[[widget]]
id = "widget"
entry = "widget.luau"

  [[widget.setting]]
  key = "glyph"
  type = "glyph"
  label_key = "settings.glyph.label"
  description_key = "settings.glyph.description"
  default = "clipboard-list"

[[panel]]
id = "panel"
entry = "panel.luau"
width = 400
height = 500
placement = "floating"
position = "auto"
open_near_click = true

[[service]]
id = "service"
entry = "service.luau"

# Launcher: type `/slate` (provider_prefix + this word).
[[launcher_provider]]
id = "launcher"
entry = "launcher.luau"
prefix = "slate"
glyph = "clipboard-list"
include_in_global_search = false
